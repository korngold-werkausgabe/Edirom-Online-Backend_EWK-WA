name: build-release-xar

on:
  workflow_dispatch:
  push:
    branches:
      - dev-ewk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create Dockerfile for building Edirom Online Backend
        run: |
          cat > Dockerfile << 'EOF'
          FROM eclipse-temurin:21 AS builder

          RUN apt-get update \
          && apt-get install -y --no-install-recommends ant 

          WORKDIR /opt/app

          COPY . .

          RUN ant
          EOF

      - name: Build Docker Image for building Edirom Online Backend
        run: |
          docker build -t edirom-online-build .

      - name: Extract Edirom Online Backend XAR from container
        run: |
          docker create --name builder edirom-online-build
          mkdir -p build-xar
          docker cp builder:/opt/app/build-xar/. ./build-xar/
          docker rm builder

      - name: Upload XAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: eob-ewk
          path: build-xar/*.xar
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download XAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: eob-ewk
          path: .

      - name: Extract version and prepare files
        id: version
        run: |
          XAR_FILE=$(ls Edirom-Online-Backend*.xar | head -1)
          VERSION=$(echo "$XAR_FILE" | grep -oP '(?<=Edirom-Online-Backend-)[^-]+')
          echo "xar_file=$XAR_FILE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp "$XAR_FILE" eob-ewk-latest.xar

      - name: Upload XAR to versioned Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.xar_file }}
          name: Release ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: eob-ewk-latest.xar
          name: Latest Release
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

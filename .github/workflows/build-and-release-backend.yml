name: Build Edirom Online Backend

on:
  workflow_dispatch:
  push:
    branches:
      - dev-ewk
      - bug/9-gh-action-fails

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre git

      - name: Copy Sencha CMD Dockerfile
        run: |
          git clone --depth 1 https://github.com/bwbohl/sencha-cmd.git /tmp/sencha-cmd
          cp /tmp/sencha-cmd/Dockerfile ${{ github.workspace }}/Dockerfile

      - name: Build Docker Image
        run: |
          docker build -f ${{ github.workspace }}/Dockerfile -t edirom-online-build .
        working-directory: ${{ github.workspace }}

      - name: Run Build in Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app edirom-online-build "ant"

      - name: Upload XAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: eob-ewk
          path: build-xar/*.xar
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download XAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: eob-ewk

      - name: Rename XAR file
        run: |
          mv Edirom-Online-Backend*.xar eob-ewk-latest.xar

      - name: Upload XAR to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: eob-ewk-latest.xar
          name: Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
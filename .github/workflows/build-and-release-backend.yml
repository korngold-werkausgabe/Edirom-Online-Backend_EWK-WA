name: Build Edirom Online Backend

on:
  workflow_dispatch:
  push:
    branches:
      - dev-ewk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM eclipse-temurin:21 AS builder

          RUN apt-get update \
          && apt-get install -y --no-install-recommends ant 

          WORKDIR /opt/app

          COPY . .

          RUN ant
          EOF

      - name: Upload Dockerfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile
          path: Dockerfile

      - name: Build Docker Image
        run: |
          docker build -t edirom-online-build .

      - name: Extract XAR from container
        run: |
          docker create --name builder edirom-online-build
          mkdir -p build-xar
          docker cp builder:/opt/app/build-xar/. ./build-xar/
          docker rm builder

      - name: Upload XAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: eob-ewk
          path: build-xar/*.xar
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download XAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: eob-ewk

      - name: Rename XAR file
        run: |
          mv Edirom-Online-Backend*.xar eob-ewk-latest.xar

      - name: Upload XAR to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: eob-ewk-latest.xar
          name: Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Dockerfile artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/edirom-online-backend-ewk
            korngoldwerkausgabe/edirom-online-backend-ewk
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
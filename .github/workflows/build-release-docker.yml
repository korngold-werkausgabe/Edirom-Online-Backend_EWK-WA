name: build-release-docker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-release-xar"]
    types:
      - completed
    branches:
      - dev-ewk
      - bug/9-gh-action-fails

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download XAR artifact from build workflow
        uses: actions/download-artifact@v4
        with:
          name: eob-ewk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Rename XAR file
        run: |
          mv Edirom-Online-Backend*.xar eob-ewk-latest.xar

      - name: Create Dockerfile for Edirom Online Backend
        run: |
          cat > Dockerfile << 'EOF'
          FROM stadlerpeter/existdb:6.3.0
          ENV EXIST_ENV=production
          ENV EXIST_DEFAULT_APP_PATH=xmldb:exist:///db/apps/Edirom-Online

          COPY --chown=wegajetty eob-ewk-latest.xar ${EXIST_HOME}/autodeploy/
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/edirom-online-backend-ewk
            korngoldwerkausgabe/edirom-online-backend-ewk
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

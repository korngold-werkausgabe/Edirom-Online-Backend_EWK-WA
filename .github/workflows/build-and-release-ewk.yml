name: Build and Release EWK Backend
on:
  push:
    branches:
      - dev-ewk
    tags:
      - "v*"
      - "release-*"

env:
  IMAGE_NAME_GHCR: ghcr.io/korngold-werkausgabe/eob-ewk:latest
  IMAGE_NAME_DOCKERHUB: korngoldwerkausgabe/eob-ewk:latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ------------- Docker Registries Login & Buildx Setup ----------
      - name: Login to GitHub Packages Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: korngoldwerkausgabe
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------ Docker Image Build & Push (multiarch) ----------
      - name: Build and push multiarch image
        env:
          IMAGE_NAME_GHCR: ghcr.io/korngold-werkausgabe/eob-ewk:latest
          IMAGE_NAME_DOCKERHUB: korngoldwerkausgabe/eob-ewk:latest
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile \
            -t $IMAGE_NAME_GHCR \
            -t $IMAGE_NAME_DOCKERHUB \
            --push .
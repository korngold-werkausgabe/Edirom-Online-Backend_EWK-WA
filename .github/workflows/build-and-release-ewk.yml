name: Build and Release EWK

on:
  push:
    branches:
      - dev-ewk
      - bug/9-gh-action-fails

env:
  IMAGE_NAME: eob-ewk
  IMAGE_NAME_GHCR: ghcr.io/korngold-werkausgabe/eob-ewk-backend:latest
  IMAGE_NAME_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME }}/eob-ewk-backend:latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      # --- Build XAR ---
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build XAR with Ant
        run: ant xar

      - name: Copy XAR to fixed file name
        run: cp build-xar/*.xar eob-ewk-latest.xar

      # --- Build Dockerimage ---
      - name: Login to GitHub Packages Docker
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with latest tag
        run: |
          docker build -t ${{ env.IMAGE_NAME_GHCR }} -t ${{ env.IMAGE_NAME_DOCKERHUB }} .

      # --- Release XAR ---
      - name: Upload XAR as Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: eob-ewk-latest.xar

      # --- Release Dockerimage ---
      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ${{ env.IMAGE_NAME_GHCR }}

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ env.IMAGE_NAME_DOCKERHUB }}
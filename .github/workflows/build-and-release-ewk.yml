name: Build and Release EWK

on:
  push:
    branches:
      - dev-ewk
      - bug/9-gh-action-fails
    tags:
      - 'v*'
      - 'release-*'

env:
  IMAGE_NAME: eob-ewk
  IMAGE_NAME_GHCR: ghcr.io/korngold-werkausgabe/eob-ewk:latest
  IMAGE_NAME_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME }}/eob-ewk:latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      # --- Build XAR ---
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build XAR with Ant
        run: ant xar

      - name: Copy XAR to fixed file name
        run: cp build-xar/*.xar eob-ewk-latest.xar

      # --- Build Docker image with existdb ---
      - name: Login to GitHub Packages Docker
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build multiarch image and push
        env:
          IMAGE_NAME_GHCR: ghcr.io/${{ secrets.DOCKERHUB_USERNAME }}/eob-ewk:latest
          IMAGE_NAME_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME }}/eob-ewk:latest
        run: |
          cat <<EOF > Dockerfile
          FROM stadlerpeter/existdb
          COPY eob-ewk-latest.xar /exist/autodeploy/
          EOF

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME_GHCR \
            -t $IMAGE_NAME_DOCKERHUB \
            --push .

      # --- Release XAR ---
      - name: Upload eob-ewk-latest.xar as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eob-ewk-latest.xar
          path: eob-ewk-latest.xar

      - name: Upload eob-ewk-latest.xar as Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: eob-ewk-latest.xar

      # --- Push Docker Images ---
      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push $IMAGE_NAME_GHCR

      - name: Push Docker image to DockerHub
        run: |
          docker push $IMAGE_NAME_DOCKERHUB
name: build-docker-image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-release-xar"]
    types:
      - completed
    branches:
      - dev-ewk
      - bug/9-gh-action-fails

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Download XAR artifact from build workflow
        uses: actions/download-artifact@v4
        with:
          name: eob-ewk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Rename XAR file
        run: |
          mv Edirom-Online-Backend*.xar eob-ewk-latest.xar

      - name: Create Dockerfile for Edirom Online Backend
        run: |
          cat > Dockerfile << 'EOF'
          FROM stadlerpeter/existdb:6.3.0
          ENV EXIST_ENV=production
          ENV EXIST_DEFAULT_APP_PATH=xmldb:exist:///db/apps/Edirom-Online

          COPY --chown=wegajetty eob-ewk-latest.xar ${EXIST_HOME}/autodeploy/
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edirom/online-backend-ewk:${{ github.sha }}-amd64
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/docker-image-amd64.tar

      - name: Build Docker image for arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edirom/online-backend-ewk:${{ github.sha }}-arm64
          platforms: linux/arm64
          outputs: type=docker,dest=/tmp/docker-image-arm64.tar

      - name: Upload Docker images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: |
            /tmp/docker-image-amd64.tar
            /tmp/docker-image-arm64.tar
          retention-days: 7

      - name: Trigger release-docker-image workflow
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run release-docker-image.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f build_sha=${{ github.sha }} \
            -f run_id=${{ github.run_id }}